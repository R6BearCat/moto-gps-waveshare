name: iOS Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: platforms/ios
        run: |
          xcodegen generate
          ls -la MotoGPS.xcodeproj

      - name: Build unsigned iPhone app
        run: |
          set -euxo pipefail

          xcodebuild \
            -project platforms/ios/MotoGPS.xcodeproj \
            -scheme MotoGPS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MotoGPSDerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="com.zeyan.motogps" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          APP_DIR="$RUNNER_TEMP/MotoGPSDerivedData/Build/Products/Release-iphoneos"

          APP_PATH="$(
            find "$APP_DIR" \
              -maxdepth 1 \
              -name '*.app' \
              -print \
              -quit
          )"

          test -n "$APP_PATH"

          echo "Found app:"
          echo "$APP_PATH"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP_PATH/Info.plist"

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP_PATH/Info.plist"
          )"

          file "$APP_PATH/$EXECUTABLE"

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/MotoGPS-unsigned.ipa" Payload

          ls -lh "$GITHUB_WORKSPACE/MotoGPS-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGPS-unsigned-ipa
          path: MotoGPS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
